[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SynEIAgent"
version = "0.1.0"
description = "SynEIAgent lightweight WebRTC robot gateway"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.9.0",
  "aiortc>=1.8.0",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
  "Pillow>=10.0.0"
]

[project.scripts]
syneiagent-gateway = "gateway_lite.main:main"
syneiagent-ros-bridge = "ros_bridge_lite.main:main"

[project.optional-dependencies]
rl = [
  "openvino>=2024.0",
  "PyYAML>=6.0",
]
test = [
  "pytest>=7.0",
  "hypothesis>=6.0",
]

[tool.setuptools]
packages = ["gateway_lite", "ros_bridge_lite"]
